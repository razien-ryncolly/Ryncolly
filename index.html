<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ryncolly - Ultimate Anime Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');

        :root {
            --bg-main: #050508;
            --bg-card: #0f0f18;
            --bg-hover: #161624;
            --accent: #ff2a5f;
            --accent-glow: rgba(255, 42, 95, 0.4);
            --text-main: #ffffff;
            --text-dim: #9499b7;
            --border: rgba(255, 255, 255, 0.08);
            --border-glow: rgba(255, 42, 95, 0.6);
            --admin-color: #3b82f6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            background-image: 
                radial-gradient(circle at 15% 10%, rgba(255, 42, 95, 0.08) 0%, transparent 45%),
                radial-gradient(circle at 85% 90%, rgba(59, 130, 246, 0.06) 0%, transparent 45%);
            color: var(--text-main);
            padding: 16px;
            overflow-x: hidden;
            min-height: 100vh;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* HEADER */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            margin-bottom: 24px;
            background: rgba(15, 15, 24, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 22px;
            animation: fadeIn 0.3s ease-out;
            box-shadow: 0 12px 35px rgba(0,0,0,0.6);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .menu-toggle-btn {
            background: var(--bg-hover);
            border: 1px solid var(--border);
            color: var(--text-main);
            font-size: 16px;
            width: 42px;
            height: 42px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .menu-toggle-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(255, 42, 95, 0.15);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .logo-container {
            text-align: left;
        }

        .logo {
            font-size: 22px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .logo .ryn { color: var(--accent); text-shadow: 0 0 15px var(--accent-glow); }
        .logo .colly { color: var(--text-main); }
        
        .creator-tag {
            color: var(--text-dim);
            font-size: 9px;
            margin-top: 1px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 700;
        }
        .creator-tag span { color: var(--accent); }

        /* SIDEBAR */
        .sidebar-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 5, 8, 0.85);
            backdrop-filter: blur(15px);
            z-index: 1000;
            opacity: 0; visibility: hidden;
            transition: all 0.35s ease;
        }
        .sidebar-overlay.active { opacity: 1; visibility: visible; }

        .sidebar {
            position: fixed;
            top: 0; left: -320px; width: 290px; height: 100%;
            background: rgba(12, 12, 20, 0.95);
            backdrop-filter: blur(30px);
            border-right: 1px solid var(--border);
            z-index: 1001;
            display: flex; flex-direction: column;
            transition: left 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            overflow-y: auto;
            box-shadow: 30px 0 60px rgba(0,0,0,0.9);
        }
        .sidebar.active { left: 0; }

        .sidebar-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 22px;
            border-bottom: 1px solid var(--border);
        }

        .sidebar-close-btn {
            background: var(--bg-hover); border: 1px solid var(--border);
            color: var(--text-dim); width: 38px; height: 38px; border-radius: 12px;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: all 0.2s ease;
        }
        .sidebar-close-btn:hover { border-color: var(--accent); color: var(--accent); }

        .sidebar-menu {
            padding: 18px 14px; display: flex; flex-direction: column; gap: 8px;
        }

        .sidebar-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 13px 15px; color: var(--text-dim); background: transparent;
            border: none; border-radius: 14px; font-size: 13px; font-weight: 600;
            cursor: pointer; transition: all 0.25s ease;
        }
        .sidebar-item-content { display: flex; align-items: center; gap: 14px; }
        .sidebar-item i.icon-box {
            font-size: 14px; width: 36px; height: 36px; border-radius: 12px;
            background: var(--bg-hover); display: flex; align-items: center; justify-content: center;
            color: var(--text-dim); border: 1px solid var(--border);
            transition: all 0.25s ease;
        }
        .sidebar-item:hover {
            background: var(--bg-hover); color: var(--text-main); transform: translateX(4px);
        }
        .sidebar-item:hover i.icon-box { color: var(--accent); border-color: var(--border-glow); background: rgba(255, 42, 95, 0.15); }

        /* AUTH */
        .auth-section { display: flex; align-items: center; }

        .login-btn {
            display: flex; align-items: center; gap: 8px;
            background: var(--bg-hover); border: 1px solid var(--border);
            color: var(--text-main); padding: 9px 18px; border-radius: 18px;
            font-size: 12px; font-weight: 700; cursor: pointer; transition: all 0.25s ease;
        }
        .login-btn img { width: 16px; height: 16px; }
        .login-btn:hover { border-color: var(--accent); background: rgba(255, 42, 95, 0.15); box-shadow: 0 0 15px var(--accent-glow); }

        .user-profile {
            display: none; align-items: center; gap: 10px;
            background: var(--bg-hover); border: 1px solid var(--border);
            padding: 6px 12px; border-radius: 20px;
        }
        .user-profile img { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; }
        .user-profile span { font-size: 11px; font-weight: 600; }
        .logout-btn { background: transparent; border: none; color: var(--accent); font-size: 11px; cursor: pointer; margin-left: 6px; }

        .admin-dashboard-btn {
            display: none; background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: white; border: none;
            padding: 8px 14px; border-radius: 16px; font-size: 11px; font-weight: 700;
            cursor: pointer; align-items: center; gap: 6px; margin-right: 8px;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
        }

        /* SEARCH BAR */
        .search-box {
            width: 100%;
            max-width: 600px;
            margin: 0 auto 24px auto;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 13px 18px 13px 46px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            color: white;
            font-size: 13px;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-box input:focus {
            border-color: var(--accent);
            background: var(--bg-hover);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .search-box i {
            position: absolute; left: 18px; top: 50%;
            transform: translateY(-50%); color: var(--text-dim); font-size: 14px;
        }

        /* GRID */
        .container {
            max-width: 1250px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            transition: filter 0.3s ease;
        }
        .container.loading { filter: blur(5px); pointer-events: none; }

        .anime-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 22px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
            animation: fadeIn 0.4s ease-out;
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        .anime-card:hover {
            transform: translateY(-6px);
            border-color: var(--border-glow);
            box-shadow: 0 16px 40px rgba(255, 42, 95, 0.2);
        }

        .card-cover {
            width: 100%;
            height: 220px;
            position: relative;
            background: #11111a;
            overflow: hidden;
        }

        .card-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            image-rendering: -webkit-optimize-contrast;
            transition: transform 0.4s ease;
        }

        .anime-card:hover .card-cover img {
            transform: scale(1.06);
        }

        .card-badges-absolute {
            position: absolute;
            top: 12px;
            right: 12px;
            display: flex;
            gap: 6px;
        }

        .badge {
            background: rgba(12, 12, 18, 0.85);
            backdrop-filter: blur(10px);
            color: var(--text-dim);
            font-size: 10px;
            font-weight: 700;
            padding: 5px 9px;
            border-radius: 10px;
            text-transform: uppercase;
            border: 1px solid var(--border);
        }
        .badge.rating { background: rgba(255, 215, 0, 0.15); color: #ffd700; border-color: rgba(255,215,0,0.3); }
        .badge.season { background: rgba(255, 42, 95, 0.2); color: var(--accent); border-color: var(--border-glow); }

        .card-body {
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex: 1;
        }

        .anime-title {
            font-size: 16px;
            font-weight: 800;
            color: var(--text-main);
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .anime-desc {
            font-size: 12.5px;
            color: var(--text-dim);
            line-height: 1.6;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .anisakura-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: linear-gradient(135deg, var(--accent), #ff4d79);
            color: white;
            text-decoration: none;
            padding: 12px;
            border-radius: 14px;
            font-size: 12.5px;
            font-weight: 700;
            box-shadow: 0 6px 20px var(--accent-glow);
            transition: all 0.25s ease;
            cursor: pointer;
            border: none;
            width: 100%;
            margin-top: auto;
        }
        .anisakura-btn:hover { opacity: 0.95; transform: scale(1.02); box-shadow: 0 8px 25px var(--accent-glow); }

        /* MODAL */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 5, 8, 0.85); backdrop-filter: blur(15px);
            z-index: 2000; justify-content: center; align-items: center; padding: 16px;
        }
        .modal.active { display: flex; animation: fadeIn 0.3s ease; }
        .modal-content {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 26px; width: 100%; max-width: 500px; padding: 26px;
            position: relative; max-height: 85vh; overflow-y: auto;
            box-shadow: 0 25px 60px rgba(0,0,0,0.9);
        }
        .modal-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 18px; border-bottom: 1px solid var(--border); padding-bottom: 14px;
        }
        .modal-header h3 { color: var(--accent); font-size: 18px; font-weight: 800; }
        .modal-close {
            background: var(--bg-hover); border: 1px solid var(--border); color: var(--text-dim);
            width: 36px; height: 36px; border-radius: 12px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .modal-body { color: var(--text-dim); font-size: 13.5px; line-height: 1.6; }

        .admin-section-box {
            margin-bottom: 18px; background: var(--bg-hover); padding: 16px;
            border-radius: 16px; border: 1px solid var(--border);
        }
        .admin-section-box h4 { margin-bottom: 10px; font-size: 13px; color: #fff; }
        .admin-input-group { display: flex; gap: 8px; margin-top: 8px; }
        .admin-input-group input {
            flex: 1; padding: 11px 14px; background: var(--bg-card);
            border: 1px solid var(--border); border-radius: 12px; color: white; font-size: 12px; outline: none;
        }
        .admin-input-group button {
            background: var(--accent); color: white; border: none; padding: 11px 16px;
            border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 12px;
        }
        .admin-list { list-style: none; margin-top: 10px; max-height: 120px; overflow-y: auto; }
        .admin-list li {
            display: flex; justify-content: space-between; align-items: center;
            padding: 9px 12px; background: var(--bg-card); margin-bottom: 6px;
            border-radius: 10px; font-size: 11px; border: 1px solid var(--border);
        }
        .admin-list button { background: #ef4444; color: white; border: none; padding: 5px 9px; border-radius: 6px; cursor: pointer; font-size: 10px; }

        .server-status-card {
            background: var(--bg-card); border: 1px solid var(--border); padding: 14px;
            border-radius: 14px; font-size: 12.5px; display: flex; flex-direction: column; gap: 8px;
        }
        .status-online { color: #10b981; font-weight: bold; }

        footer {
            text-align: center; padding: 35px 10px 15px; color: var(--text-dim);
            font-size: 10.5px; border-top: 1px solid var(--border); margin-top: 40px;
            text-transform: uppercase; letter-spacing: 2px; font-weight: 600;
        }
        footer span { color: var(--accent); font-weight: 800; }
    </style>
</head>
<body>

    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
    <div class="sidebar" id="appSidebar">
        <div class="sidebar-header">
            <div class="logo"><span class="ryn">RYN</span><span class="colly">COLLY</span></div>
            <button class="sidebar-close-btn" onclick="toggleSidebar()"><i class="fas fa-times"></i></button>
        </div>
        <div class="sidebar-menu">
            <div class="sidebar-item" onclick="handleMenuClick('Genres')">
                <div class="sidebar-item-content"><i class="fas fa-tag icon-box"></i><span>Genres</span></div>
                <i class="fas fa-chevron-right" style="font-size:10px; opacity:0.3;"></i>
            </div>
            <div class="sidebar-item" onclick="handleMenuClick('New Releases')">
                <div class="sidebar-item-content"><i class="fas fa-star icon-box"></i><span>New Releases</span></div>
                <i class="fas fa-chevron-right" style="font-size:10px; opacity:0.3;"></i>
            </div>
            <div class="sidebar-item" onclick="handleMenuClick('Top Rated')">
                <div class="sidebar-item-content"><i class="fas fa-trophy icon-box"></i><span>Top Rated</span></div>
                <i class="fas fa-chevron-right" style="font-size:10px; opacity:0.3;"></i>
            </div>
            <div class="sidebar-item" onclick="handleMenuClick('Random Anime')">
                <div class="sidebar-item-content"><i class="fas fa-random icon-box"></i><span>Random Anime</span></div>
                <i class="fas fa-chevron-right" style="font-size:10px; opacity:0.3;"></i>
            </div>
            <div class="sidebar-item" onclick="handleMenuClick('Status')">
                <div class="sidebar-item-content"><i class="fas fa-wave-square icon-box"></i><span>Status</span></div>
                <i class="fas fa-chevron-right" style="font-size:10px; opacity:0.3;"></i>
            </div>
        </div>
    </div>

    <div class="modal" id="actionModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Title</h3>
                <button class="modal-close" onclick="closeModal()"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body" id="modalBody">Content goes here...</div>
        </div>
    </div>

    <header>
        <div class="header-left">
            <button class="menu-toggle-btn" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
            <div class="logo-container">
                <div class="logo"><span class="ryn">RYN</span><span class="colly">COLLY</span></div>
                <div class="creator-tag">Created by <span>Redi</span></div>
            </div>
        </div>

        <div class="auth-section">
            <button id="adminDashboardBtn" class="admin-dashboard-btn" onclick="openAdminPanel()">
                <i class="fas fa-shield-alt"></i> Panel
            </button>
            <button id="loginBtn" class="login-btn" onclick="triggerGoogleLogin()">
                <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google logo"> Login
            </button>
            <div id="userProfile" class="user-profile">
                <img id="userAvatar" src="" alt="Avatar">
                <div>
                    <span id="userName">User</span>
                    <div id="userRoleBadge"></div>
                </div>
                <button class="logout-btn" onclick="signOut()"><i class="fas fa-sign-out-alt"></i></button>
            </div>
        </div>
    </header>

    <div class="search-box">
        <i class="fas fa-search"></i>
        <input type="text" id="searchInput" placeholder="Search anime..." onkeyup="filterAnime()">
    </div>

    <div class="container" id="animeContainer"></div>

    <footer>
        Ryncolly Engine v5.8 • Created by <span>Redi</span>
    </footer>

    <script>
        const OWNER_EMAIL = "dokaredjon17@gmail.com"; 
        let admins = JSON.parse(localStorage.getItem('ryncolly_admins')) || [];
        const PROXY_BASE = "https://anisakura.proxy-serveras.workers.dev/";
        
        let animeList = [];

        function toggleSidebar() {
            document.getElementById('appSidebar').classList.toggle('active');
            document.getElementById('sidebarOverlay').classList.toggle('active');
        }

        function handleMenuClick(actionName) {
            toggleSidebar();
            if(actionName === 'Status') { showPublicStatus(); return; }
            const modal = document.getElementById('actionModal');
            const modalTitle = document.getElementById('modalTitle');
            const modalBody = document.getElementById('modalBody');
            modalTitle.innerText = actionName;
            
            switch(actionName) {
                case 'Genres': modalBody.innerHTML = "Explore popular genres: Action, Adventure, Fantasy, Romance, Sci-Fi, Thriller."; break;
                case 'New Releases': modalBody.innerHTML = "Check out newest episodes synchronized directly from anisakura.xyz updated in real-time."; break;
                case 'Top Rated': modalBody.innerHTML = "Top-tier masterpieces ranked by global user reviews on AniList."; break;
                case 'Random Anime':
                    if(animeList.length > 0) {
                        const randomChoice = animeList[Math.floor(Math.random() * animeList.length)];
                        modalBody.innerHTML = `Recommended: <b>${randomChoice.title}</b><br><br>${randomChoice.desc}<br><br><button onclick="watchAnime('${randomChoice.slug}')" style="background:var(--accent); color:white; border:none; padding:10px 16px; border-radius:12px; font-weight:bold; cursor:pointer;">Watch in Anisakura &rarr;</button>`;
                    } else {
                        modalBody.innerHTML = "Loading data...";
                    }
                    break;
                default: modalBody.innerHTML = "Coming soon!";
            }
            modal.classList.add('active');
        }

        function showPublicStatus() {
            const modal = document.getElementById('actionModal');
            const modalTitle = document.getElementById('modalTitle');
            const modalBody = document.getElementById('modalBody');

            modalTitle.innerText = "Server Status";
            modalBody.innerHTML = `
                <div class="admin-section-box">
                    <h4>Server Monitoring</h4>
                    <div class="server-status-card">
                        <div>Cluster: <b>Ryncolly Proxy</b></div>
                        <div>Status: <span class="status-online">● Online (Stable)</span></div>
                        <div>Ping: <b>12ms</b></div>
                    </div>
                </div>
            `;
            modal.classList.add('active');
        }

        function openAdminPanel() {
            const modal = document.getElementById('actionModal');
            const modalTitle = document.getElementById('modalTitle');
            const modalBody = document.getElementById('modalBody');
            const savedSession = localStorage.getItem('ryncolly_user');
            let currentUser = savedSession ? JSON.parse(savedSession) : null;
            
            let isOwner = currentUser && currentUser.email.toLowerCase() === OWNER_EMAIL.toLowerCase();
            let isAdmin = currentUser && admins.includes(currentUser.email.toLowerCase());

            modalTitle.innerText = "Control Panel";
            let html = `
                <div class="admin-section-box">
                    <h4>Server Status</h4>
                    <div class="server-status-card">
                        <div>Status: <span class="status-online">● Online</span></div>
                        <div>Access: <b>Active</b></div>
                    </div>
                </div>
            `;

            if (isOwner) {
                html += `
                    <div class="admin-section-box">
                        <h4>Add Admin</h4>
                        <div class="admin-input-group">
                            <input type="email" id="newAdminEmail" placeholder="Email..." />
                            <button onclick="addAdmin()">Add</button>
                        </div>
                        <ul class="admin-list" id="adminListUI">
                            ${admins.length === 0 ? '<li style="color:var(--text-dim); justify-content:center; border:none;">No admins.</li>' : ''}
                        </ul>
                    </div>
                `;
            } else if (!isAdmin) {
                html = `<div style="text-align: center; padding: 20px; color: #ef4444;">No access rights!</div>`;
            }

            modalBody.innerHTML = html;
            modal.classList.add('active');
            if (isOwner) renderAdminListUI();
        }

        function addAdmin() {
            const input = document.getElementById('newAdminEmail');
            if (!input) return;
            const email = input.value.trim().toLowerCase();
            if (email && !admins.includes(email)) {
                admins.push(email);
                localStorage.setItem('ryncolly_admins', JSON.stringify(admins));
                input.value = '';
                renderAdminListUI();
            }
        }

        function removeAdmin(email) {
            admins = admins.filter(a => a !== email);
            localStorage.setItem('ryncolly_admins', JSON.stringify(admins));
            renderAdminListUI();
        }

        function renderAdminListUI() {
            const listUI = document.getElementById('adminListUI');
            if (!listUI) return;
            listUI.innerHTML = '';
            if (admins.length === 0) {
                listUI.innerHTML = `<li style="color:var(--text-dim); justify-content:center; border:none;">No admins.</li>`;
                return;
            }
            admins.forEach(adm => {
                listUI.innerHTML += `<li><span>${adm}</span><button onclick="removeAdmin('${adm}')">Remove</button></li>`;
            });
        }

        function closeModal() {
            document.getElementById('actionModal').classList.remove('active');
        }

        async function watchAnime(slugOrTitle) {
            const apiEndpoint = PROXY_BASE + "slug?title=" + encodeURIComponent(slugOrTitle);
            try {
                const response = await fetch(apiEndpoint);
                const data = await response.json();
                if (data.ok && data.slug) {
                    window.open(`https://anisakura.xyz/watch/${data.slug}`, '_blank');
                } else {
                    window.open(apiEndpoint, '_blank');
                }
            } catch (error) {
                window.open(apiEndpoint, '_blank');
            }
        }

        async function searchAnimeFromAniList(searchQuery = "") {
            const container = document.getElementById('animeContainer');
            if(container) container.classList.add('loading'); 

            // Explicitly requesting type: ANIME to completely exclude manga
            const query = `
                query ($search: String) {
                  Page (page: 1, perPage: 40) {
                    media (type: ANIME, search: $search, sort: [TRENDING_DESC, POPULARITY_DESC]) {
                      title { english romaji }
                      averageScore
                      description
                      episodes
                      format
                      bannerImage
                      coverImage { extraLarge large }
                    }
                  }
                }
            `;

            const variables = searchQuery ? { search: searchQuery } : {};

            try {
                const response = await fetch(PROXY_BASE + 'anilist', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json', 
                        'Accept': 'application/json' 
                    },
                    body: JSON.stringify({ query: query, variables: variables })
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const result = await response.json();
                
                if (!result.data || !result.data.Page) {
                    throw new Error('Invalid structure returned from AniList API');
                }

                const rawMedia = result.data.Page.media;

                animeList = rawMedia.map(item => {
                    const title = (item.title && (item.title.english || item.title.romaji)) ? (item.title.english || item.title.romaji) : "Unknown Title";
                    const slug = title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
                    const coverImg = (item.coverImage && item.coverImage.extraLarge) ? item.coverImage.extraLarge : (item.bannerImage || (item.coverImage ? item.coverImage.large : ''));
                    
                    return {
                        title: title,
                        seasons: item.format || "TV",
                        eps: item.episodes ? `${item.episodes} Eps` : "Ongoing",
                        rating: item.averageScore ? `${(item.averageScore / 10).toFixed(1)}` : "N/A",
                        desc: item.description ? item.description.replace(/<[^>]*>?/gm, '') : "No description available.",
                        cover: coverImg,
                        slug: slug
                    };
                });

                renderAnime(animeList);
                
            } catch (error) {
                console.error("AniList API Error:", error);
                if(container) {
                    container.classList.remove('loading');
                    container.innerHTML = `<div style="grid-column: 1 / -1; text-align: center; padding: 30px; color: #ef4444;">Failed to connect to AniList via proxy. Please check your worker script.</div>`;
                }
            }
        }

        let searchTimeout;
        function filterAnime() {
            clearTimeout(searchTimeout);
            const searchInput = document.getElementById('searchInput');
            if (!searchInput) return;
            const query = searchInput.value.trim();
            searchTimeout = setTimeout(() => { searchAnimeFromAniList(query); }, 300);
        }

        function renderAnime(data) {
            const container = document.getElementById('animeContainer');
            if (!container) return;
            container.classList.remove('loading'); 
            container.innerHTML = "";
            
            if(data.length === 0) {
                container.innerHTML = `<div style="grid-column: 1 / -1; text-align: center; padding: 30px; color: var(--text-dim);">No anime found.</div>`;
                return;
            }
            data.forEach(anime => {
                container.innerHTML += `
                    <div class="anime-card">
                        <div class="card-cover">
                            <img src="${anime.cover}" alt="${anime.title}" loading="lazy">
                            <div class="card-badges-absolute">
                                <span class="badge rating"><i class="fas fa-star"></i> ${anime.rating}</span>
                                <span class="badge season">${anime.seasons}</span>
                            </div>
                        </div>
                        <div class="card-body">
                            <h3 class="anime-title">${anime.title}</h3>
                            <p class="anime-desc">${anime.desc}</p>
                            <button onclick="watchAnime('${anime.slug}')" class="anisakura-btn">
                                <i class="fas fa-play"></i> Watch in Anisakura
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        function triggerGoogleLogin() {
            if (window.google && window.google.accounts && window.google.accounts.id) {
                google.accounts.id.prompt();
            }
        }

        function decodeJwtResponse(token) {
            let base64Url = token.split('.')[1];
            let base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            let jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        }

        function handleCredentialResponse(response) {
            const responsePayload = decodeJwtResponse(response.credential);
            const userData = { name: responsePayload.name, email: responsePayload.email, picture: responsePayload.picture };
            localStorage.setItem('ryncolly_user', JSON.stringify(userData));
            applyUserSession(userData);
        }

        function applyUserSession(user) {
            const loginBtn = document.getElementById('loginBtn');
            const userProfile = document.getElementById('userProfile');
            const adminDashboardBtn = document.getElementById('adminDashboardBtn');
            const userRoleBadge = document.getElementById('userRoleBadge');

            if (loginBtn) loginBtn.style.display = 'none';
            if (userProfile) userProfile.style.display = 'flex';
            
            document.getElementById('userAvatar').src = user.picture;
            document.getElementById('userName').innerText = user.name;

            const email = user.email.toLowerCase();
            if (email === OWNER_EMAIL.toLowerCase()) {
                if (adminDashboardBtn) adminDashboardBtn.style.display = 'flex';
                if (userRoleBadge) userRoleBadge.innerHTML = `<span style="font-size:8px; color:var(--accent); font-weight:800;">OWNER</span>`;
            } else if (admins.includes(email)) {
                if (adminDashboardBtn) adminDashboardBtn.style.display = 'flex';
                if (userRoleBadge) userRoleBadge.innerHTML = `<span style="font-size:8px; color:#3b82f6; font-weight:800;">ADMIN</span>`;
            } else {
                if (adminDashboardBtn) adminDashboardBtn.style.display = 'none';
                if (userRoleBadge) userRoleBadge.innerHTML = '';
            }
        }

        function signOut() {
            localStorage.removeItem('ryncolly_user');
            document.getElementById('userProfile').style.display = 'none';
            document.getElementById('loginBtn').style.display = 'flex';
            document.getElementById('adminDashboardBtn').style.display = 'none';
            if (window.google && window.google.accounts) google.accounts.id.disableAutoSelect();
        }

        window.onload = function() {
            searchAnimeFromAniList();
            if (window.google && window.google.accounts) {
                google.accounts.id.initialize({
                    client_id: "YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com",
                    callback: handleCredentialResponse
                });
            }
            const savedUser = localStorage.getItem('ryncolly_user');
            if (savedUser) applyUserSession(JSON.parse(savedUser));
        }
    </script>
</body>
</html>
